name: easytier_pro_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.4.0
  crypto: ^3.0.6
  shared_preferences: ^2.5.3
  shared_preferences_platform_interface: ^2.4.2
  tray_manager: ^0.5.2
  url_launcher: ^6.3.1
  window_manager: ^0.5.1
  cupertino_icons: ^1.0.8
  forui:
    path: third_party/forui_ohos
  font_awesome_flutter: ^11.0.0
  flutter_staggered_grid_view: ^0.7.0
  fl_chart: ^1.2.0
  auto_updater: ^1.0.0
  package_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  url_launcher_platform_interface: ^2.3.2
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/easytier.png
    - assets/images/easytier_header.png
    - assets/images/tray_icon_macos.png
    - windows/runner/resources/app_icon.ico
    - windows/runner/resources/tray_icon.ico
    - web/favicon.png
