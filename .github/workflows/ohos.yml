name: ohos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_OHOS_REPOSITORY: https://gitcode.com/CPF-Flutter/flutter_flutter.git
  FLUTTER_OHOS_REF: 3.44.9+ohos-1.0.0-beta
  FLUTTER_OHOS_COMMIT: 744cbb4f08e577787774c04033cc19a9d318d0d2
  OHOS_COMMAND_LINE_TOOLS_VERSION: 6.1.1.280

jobs:
  ohos-check:
    name: ohos-unsigned-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up HarmonyOS Command Line Tools
        uses: ErBWs/setup-ohos@v2
        with:
          version: ${{ env.OHOS_COMMAND_LINE_TOOLS_VERSION }}
          cache: true

      - name: Set up Flutter OHOS build environment
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libgl1-mesa-dev
          git clone --depth 1 --branch "$FLUTTER_OHOS_REF" \
            "$FLUTTER_OHOS_REPOSITORY" "$RUNNER_TEMP/flutter-ohos"
          test "$(git -C "$RUNNER_TEMP/flutter-ohos" rev-parse HEAD)" = \
            "$FLUTTER_OHOS_COMMIT"
          echo "$RUNNER_TEMP/flutter-ohos/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_GIT_URL=$FLUTTER_OHOS_REPOSITORY" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/flutter-ohos/bin/flutter" config --enable-ohos
          "$RUNNER_TEMP/flutter-ohos/bin/flutter" config --ohos-sdk "$OHOS_NDK_HOME"

      - name: Install HarmonyOS dependencies
        working-directory: ohos
        run: |
          set -euo pipefail
          test -s easytier-ohrs-0.0.1.har
          sha256sum easytier-ohrs-0.0.1.har
          ohpm install

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify unsigned Release HAP compilation
        run: |
          set -euo pipefail
          CI=true flutter build hap --release --no-codesign --no-pub
          unsigned_hap=$(find build/ohos/hap -type f -name '*-unsigned.hap' -print -quit)
          test -n "$unsigned_hap"
          echo "Verified unsigned Release HAP locally in CI (not uploaded): $unsigned_hap"
