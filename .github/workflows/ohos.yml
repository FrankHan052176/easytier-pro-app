name: ohos

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [core-har-published]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_OHOS_REPOSITORY: https://gitcode.com/CPF-Flutter/flutter_flutter.git
  FLUTTER_OHOS_REF: 3.41.10-ohos-0.0.2-beta
  FLUTTER_OHOS_COMMIT: eea47c62cc5ff1000db068306ffe7279d53e889b
  OHOS_COMMAND_LINE_TOOLS_VERSION: 6.1.1.280
  CODEARTS_OHPM_REGISTRY: https://devrepo.devcloud.cn-north-4.huaweicloud.com/artgalaxy/api/ohpm/cn-north-4_c07b1b38744f424b8d87a86532d38003_ohpm_1/
  CORE_HAR_PACKAGE: ${{ github.event.client_payload.package_name || 'easytier-ohrs' }}
  SIGNING_REPOSITORY: ${{ vars.SIGNING_REPOSITORY || 'FrankHan052176/EasyTierProSigning' }}
  SIGNING_REPOSITORY_REF: ${{ vars.SIGNING_REPOSITORY_REF || 'main' }}

jobs:
  ohos:
    name: ohos
    runs-on: ubuntu-latest
    env:
      AGC_CLIENT_ID: ${{ secrets.AGC_CLIENT_ID }}
      AGC_CLIENT_SECRET: ${{ secrets.AGC_CLIENT_SECRET }}
      AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
      AGC_API_DOMAIN: ${{ vars.AGC_API_DOMAIN || 'connect-api.cloud.huawei.com' }}
      AGC_TEST_DURATION_DAYS: ${{ vars.AGC_TEST_DURATION_DAYS || '14' }}

    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up HarmonyOS Command Line Tools
        uses: ErBWs/setup-ohos@v2
        with:
          version: ${{ env.OHOS_COMMAND_LINE_TOOLS_VERSION }}
          cache: true

      - name: Set up Flutter OHOS build environment
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libgl1-mesa-dev
          git clone --depth 1 --branch "$FLUTTER_OHOS_REF" \
            "$FLUTTER_OHOS_REPOSITORY" "$RUNNER_TEMP/flutter-ohos"
          test "$(git -C "$RUNNER_TEMP/flutter-ohos" rev-parse HEAD)" = \
            "$FLUTTER_OHOS_COMMIT"
          echo "$RUNNER_TEMP/flutter-ohos/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_GIT_URL=$FLUTTER_OHOS_REPOSITORY" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/flutter-ohos/bin/flutter" config --enable-ohos

      - name: Install HarmonyOS dependencies and Core HAR
        id: core_har
        working-directory: ohos
        env:
          CODEARTS_PRIVATE_OHPM_READ: ${{ secrets.CODEARTS_PRIVATE_OHPM_READ }}
        run: |
          set -euo pipefail
          ohpm uninstall "$CORE_HAR_PACKAGE"

          mkdir -p "$HOME/.ohpm"
          umask 077
          printf '%s' "$CODEARTS_PRIVATE_OHPM_READ" > "$HOME/.ohpm/.ohpmrc"

          ohpm install "$CORE_HAR_PACKAGE@latest" \
            --registry "$CODEARTS_OHPM_REGISTRY"
          ohpm install

          resolved_version=$(jq -r '.version' \
            "oh_modules/$CORE_HAR_PACKAGE/oh-package.json5")
          package_branch=$(printf '%s\n' "$resolved_version" | sed -E \
            's/^[0-9]+\.[0-9]+\.[0-9]+-//; s/-[0-9]+-[0-9]+-[0-9]+-g[0-9a-f]+$//')
          echo "Installed Core HAR: ${CORE_HAR_PACKAGE}@${resolved_version}"
          echo "package_branch=$package_branch" >> "$GITHUB_OUTPUT"
          echo "package_version=$resolved_version" >> "$GITHUB_OUTPUT"

          cd ..
          flutter pub get

      - name: Prepare signing configuration
        env:
          GH_TOKEN: ${{ secrets.SIGNING_REPOSITORY_TOKEN }}
          SIGNING_REPOSITORY_DIR: ${{ runner.temp }}/signing-repository
          SIGNING_APP_DIR: .
          SIGNING_SOURCE_CONFIG_NAME: sign.json
          SIGNING_OUTPUT_DIR: ${{ runner.temp }}/easytier-pro-signing
        run: |
          set -euo pipefail
          gh repo clone \
            "$SIGNING_REPOSITORY" \
            "$SIGNING_REPOSITORY_DIR" \
            -- \
            --depth=1 \
            --branch "$SIGNING_REPOSITORY_REF"
          .github/ci/prepare-signing-config.sh
          echo "EASYTIER_PRO_SIGNING_DIR=$SIGNING_OUTPUT_DIR" >> "$GITHUB_ENV"

      - name: Build signed publish release App
        id: app
        env:
          CORE_HAR_BRANCH: ${{ steps.core_har.outputs.package_branch }}
          CORE_HAR_VERSION: ${{ steps.core_har.outputs.package_version }}
        run: |
          set -euo pipefail
          CI=true flutter build app \
            --release \
            --flavor publish \
            --target-platform ohos-arm64 \
            --no-pub

          signed_app=$(find ohos/build/outputs/publish \
            -type f -name '*-signed.app' -print -quit)
          test -n "$signed_app"
          app_name="EasyTier-${CORE_HAR_BRANCH}-${CORE_HAR_VERSION}"
          app_path="$RUNNER_TEMP/$app_name.app"
          mv "$signed_app" "$app_path"
          echo "name=$app_name" >> "$GITHUB_OUTPUT"
          echo "path=$app_path" >> "$GITHUB_OUTPUT"

      - name: Upload signed HarmonyOS App
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app.outputs.name }}
          path: ${{ steps.app.outputs.path }}
          retention-days: 14
          if-no-files-found: error

      - name: Upload and submit AGC test version
        if: ${{ env.AGC_CLIENT_ID != '' && env.AGC_CLIENT_SECRET != '' && env.AGC_APP_ID != '' }}
        id: agc
        env:
          AGC_APP_FILE: ${{ steps.app.outputs.path }}
          AGC_EVENT_NAME: ${{ github.event_name }}
          AGC_RUN_ATTEMPT: ${{ github.run_attempt }}
          AGC_NOTIFY_ON_PUSH: "0"
          AGC_APP_NAME_PREFIX: EasyTierPro
          AGC_CORE_HAR_VERSION: ${{ steps.core_har.outputs.package_version }}
          AGC_PUSH_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          AGC_WORKFLOW_SHA: ${{ github.sha }}
        run: .github/scripts/agc-test-release.sh "$AGC_APP_FILE"

      - name: Remove credentials and signing material
        if: always()
        run: |
          rm -rf \
            "$RUNNER_TEMP/signing-repository" \
            "$RUNNER_TEMP/easytier-pro-signing"
          rm -f "$HOME/.ohpm/.ohpmrc"
