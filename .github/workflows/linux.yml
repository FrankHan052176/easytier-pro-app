name: Linux and HarmonyOS

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_OHOS_REPOSITORY: https://gitcode.com/CPF-Flutter/flutter_flutter.git
  FLUTTER_OHOS_REF: 3.41.10-ohos-0.0.2-beta
  FLUTTER_OHOS_COMMIT: eea47c62cc5ff1000db068306ffe7279d53e889b
  OHOS_COMMAND_LINE_TOOLS_VERSION: 6.1.1.280
  OHRS_HAR_SHA256: 8c659f30247a0a3350a3e8e875f9562d9ab14115ab9d209f6d2aa1f68e23fd4a

jobs:
  linux:
    name: Linux analyze, test, and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libayatana-appindicator3-dev \
            libglu1-mesa \
            libgtk-3-dev \
            libstdc++-12-dev \
            ninja-build \
            pkg-config

      - name: Set up Flutter OHOS
        run: |
          git clone --depth 1 --branch "$FLUTTER_OHOS_REF" \
            "$FLUTTER_OHOS_REPOSITORY" "$RUNNER_TEMP/flutter-ohos"
          test "$(git -C "$RUNNER_TEMP/flutter-ohos" rev-parse HEAD)" = \
            "$FLUTTER_OHOS_COMMIT"
          echo "$RUNNER_TEMP/flutter-ohos/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_GIT_URL=$FLUTTER_OHOS_REPOSITORY" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/flutter-ohos/bin/flutter" --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart sources
        run: dart analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Linux release bundle
        run: flutter build linux --release --no-pub

      - name: Upload Linux release bundle
        uses: actions/upload-artifact@v4
        with:
          name: easytier-pro-linux-x64
          path: build/linux/x64/release/bundle
          if-no-files-found: error

  ohos:
    name: HarmonyOS unsigned release App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Install HarmonyOS host dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgl1-mesa-dev

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up HarmonyOS Command Line Tools
        id: setup-ohos
        uses: ErBWs/setup-ohos@v2
        with:
          version: ${{ env.OHOS_COMMAND_LINE_TOOLS_VERSION }}
          cache: true

      - name: Set up Flutter OHOS
        run: |
          git clone --depth 1 --branch "$FLUTTER_OHOS_REF" \
            "$FLUTTER_OHOS_REPOSITORY" "$RUNNER_TEMP/flutter-ohos"
          test "$(git -C "$RUNNER_TEMP/flutter-ohos" rev-parse HEAD)" = \
            "$FLUTTER_OHOS_COMMIT"
          echo "$RUNNER_TEMP/flutter-ohos/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_GIT_URL=$FLUTTER_OHOS_REPOSITORY" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/flutter-ohos/bin/flutter" --version

      - name: Configure Flutter for HarmonyOS
        run: |
          test -d "$HOS_SDK_HOME"
          test -d "$OHOS_NDK_HOME"
          test -n "${{ steps.setup-ohos.outputs.sdk-version }}"
          test "${{ steps.setup-ohos.outputs.api-version }}" = "24"
          flutter config --enable-ohos
          flutter config --ohos-sdk "$OHOS_NDK_HOME"
          flutter config --list
          flutter doctor -v
          ohpm --version
          hvigorw --version
          node --version
          java -version

      - name: Verify HarmonyOS native bridge
        run: |
          test -s ohos/easytier-ohrs-0.0.1.har
          actual_sha256="$(sha256sum ohos/easytier-ohrs-0.0.1.har | awk '{print $1}')"
          test "$actual_sha256" = "$OHRS_HAR_SHA256"

      - name: Install Flutter dependencies
        run: flutter pub get

      # Certificate and signing integration will be added once its secret-delivery
      # scheme is defined. Keep this build unsigned until then.
      - name: Build unsigned HarmonyOS release App
        run: >
          CI=true flutter build app
          --release
          --target-platform ohos-arm64
          --no-codesign
          --no-pub

      - name: Verify HarmonyOS App artifact
        run: test -s build/ohos/app/ohos-default-unsigned.app

      - name: Upload unsigned HarmonyOS App
        uses: actions/upload-artifact@v4
        with:
          name: easytier-pro-harmonyos-arm64-release-unsigned-app
          path: build/ohos/app/ohos-default-unsigned.app
          if-no-files-found: error
